<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Clean Campus Reporting</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
font-family:Poppins,sans-serif;
color:white;
}

.contact-container{
display:flex;
justify-content:center;
align-items:center;
padding:120px 20px;
}

.contact-card{
width:700px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.contact-card h2{
text-align:center;
margin-bottom:25px;
}

.form-group{
margin-bottom:18px;
}

.form-group label{
display:block;
margin-bottom:8px;
font-weight:600;
}

.form-group input,
.form-group textarea{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
outline:none;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:15px;
background:#00ffae;
color:black;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 15px #00ffae;
}

.info{
margin-top:30px;
text-align:center;
}

.info p{
margin:10px 0;
}

</style>

</head>

<body>

<nav class="navbar">

<div class="logo">
<i class="fa-solid fa-leaf"></i>
Clean Campus
</div>

<li><a href="reports.html">View Reports</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

<div class="contact-container">

<div class="contact-card">

<h2>Contact Us</h2>

<form id="contactForm">

<div class="form-group">
<label>Name</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" required>
</div>

<div class="form-group">
<label>Message</label>
<textarea required></textarea>
</div>

<button type="submit">
<i class="fa-solid fa-paper-plane"></i>
Send Message
</button>

</form>

<div class="info">

<p><i class="fa-solid fa-location-dot"></i> Your College Campus</p>

<p><i class="fa-solid fa-envelope"></i> cleancampus@gmail.com</p>

<p><i class="fa-solid fa-phone"></i> +91 9876543210</p>

</div>

</div>

</div>
