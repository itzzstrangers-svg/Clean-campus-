<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | Clean Campus Reporting</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
font-family:Poppins,sans-serif;
color:white;
}

.container{
padding:120px 8%;
}

h1{
text-align:center;
margin-bottom:30px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:40px;
}

.box{
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.3);
transition:.3s;
}

.box:hover{
transform:translateY(-10px);
}

.box h2{
font-size:40px;
color:#00ffae;
}

table{
width:100%;
border-collapse:collapse;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:20px;
overflow:hidden;
}

th,td{
padding:15px;
text-align:center;
}

th{
background:#00ffae;
color:black;
}

tr:nth-child(even){
background:rgba(255,255,255,.05);
}

button{
padding:8px 15px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.resolve{
background:#00ffae;
}

.delete{
background:red;
color:white;
}

</style>

</head>

<body>

<nav class="navbar">

<div class="logo">
<i class="fa-solid fa-leaf"></i>
Clean Campus
</div>

<ul>

<li><a href="index.html">Home</a></li>
<li><a href="report.html">Report Issue</a></li>
<li><a href="reports.html">View Reports</a></li>
<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

<div class="container">

<h1>Admin Dashboard</h1>

<div class="dashboard">

<div class="box">
<h2 id="totalReports">0</h2>
<p>Total Reports</p>
</div>

<div class="box">
<h2 id="pendingReports">0</h2>
<p>Pending</p>
</div>

<div class="box">
<h2 id="resolvedReports">0</h2>
<p>Resolved</p>
</div>

</div>

<table>

<thead>

<tr>

<th>Name</th>

<th>Issue</th>

<th>Location</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="adminTable">

</tbody>

</table>

</div>

<footer>

<p style="text-align:center;padding:20px;">
© 2026 Clean Campus Reporting Website
</p>

</footer>

<script type="module" src="firebase.js"></script>
<script type="module" src="admin.js"></script>

</body>
</html>
