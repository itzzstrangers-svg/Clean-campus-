<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Issue | Clean Campus Reporting</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
font-family:Poppins,sans-serif;
color:white;
}

.report-container{
display:flex;
justify-content:center;
align-items:center;
padding:120px 20px 50px;
}

.report-card{
width:700px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
padding:35px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,.4);
}

.report-card h2{
text-align:center;
margin-bottom:25px;
}

.form-group{
margin-bottom:18px;
}

.form-group label{
display:block;
margin-bottom:8px;
font-weight:600;
}

.form-group input,
.form-group select,
.form-group textarea{

width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
outline:none;

}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:15px;
background:#00ffae;
color:black;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
box-shadow:0 0 15px #00ffae;
}

</style>

</head>

<body>

<nav class="navbar">

<div class="logo">
<i class="fa-solid fa-leaf"></i>
Clean Campus
</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="about.html">About</a></li>

<li><a href="report.html">Report Issue</a></li>

<li><a href="reports.html">View Reports</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

<div class="report-container">

<div class="report-card">

<h2>Report a Campus Issue</h2>

<form id="reportForm">

<div class="form-group">
<label>Full Name</label>
<input type="text" id="name" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email" required>
</div>

<div class="form-group">
<label>Department</label>
<input type="text" id="department" required>
</div>

<div class="form-group">
<label>Issue Type</label>

<select id="issueType" required>

<option value="">Select Issue</option>

<option>Garbage</option>

<option>Overflowing Dustbin</option>

<option>Water Leakage</option>

<option>Broken Bench</option>

<option>Broken Chair</option>

<option>Damaged Toilet</option>

<option>Broken Light</option>

<option>Others</option>

</select>

</div>

<div class="form-group">
<label>Location</label>
<input type="text" id="location" required>
</div>

<div class="form-group">
<label>Description</label>
<textarea id="description" required></textarea>
</div>

<div class="form-group">
<label>Upload Image</label>
<input type="file" id="photo" accept="image/*">
</div>

<button type="submit">
<i class="fa-solid fa-paper-plane"></i>
Submit Report
</button>

</form>

</div>

</div>

<footer>

<p style="text-align:center;padding:20px;">
© 2026 Clean Campus Reporting Website
</p>

</footer>

<script type="module" src="firebase.js"></script>
<script type="module" src="report.js"></script>

</body>
</html>
